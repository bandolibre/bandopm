<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#182232"/>
    </linearGradient>
    <linearGradient id="leftBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1f6f6a"/>
    </linearGradient>
    <linearGradient id="rightBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bellowsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#2a364b" stroke-width="10"/>

  <!-- Subtle Acoustic Wave Arcs -->
  <path d="M 96 116 Q 256 64 416 116" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path d="M 136 90 Q 256 48 376 90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

  <!-- Left Cabezal (Bajos - Teal) -->
  <rect x="64" y="148" width="90" height="224" rx="16" fill="url(#leftBox)" stroke="#5eead4" stroke-width="5"/>
  <!-- Left Pearl Buttons -->
  <circle cx="96" cy="186" r="8" fill="#f8fafc"/>
  <circle cx="122" cy="204" r="8" fill="#f8fafc"/>
  <circle cx="96" cy="226" r="8" fill="#f8fafc"/>
  <circle cx="122" cy="244" r="8" fill="#f8fafc"/>
  <circle cx="96" cy="266" r="8" fill="#f8fafc"/>
  <circle cx="122" cy="284" r="8" fill="#f8fafc"/>
  <circle cx="96" cy="306" r="8" fill="#f8fafc"/>
  <circle cx="122" cy="324" r="8" fill="#f8fafc"/>

  <!-- Center Bellows (Fueye Pleats) -->
  <polygon points="154,162 188,146 222,162 256,144 290,162 324,146 358,162 358,358 324,374 290,358 256,376 222,358 188,374 154,358"
           fill="url(#bellowsGrad)" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pleat Rib Lines -->
  <line x1="188" y1="146" x2="188" y2="374" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="222" y1="162" x2="222" y2="358" stroke="#475569" stroke-width="3"/>
  <line x1="256" y1="144" x2="256" y2="376" stroke="#38bdf8" stroke-width="5"/>
  <line x1="290" y1="162" x2="290" y2="358" stroke="#475569" stroke-width="3"/>
  <line x1="324" y1="146" x2="324" y2="374" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Right Cabezal (Cantabile - Amber) -->
  <rect x="358" y="148" width="90" height="224" rx="16" fill="url(#rightBox)" stroke="#fcd34d" stroke-width="5"/>
  <!-- Right Pearl Buttons -->
  <circle cx="390" cy="186" r="8" fill="#fffbeb"/>
  <circle cx="416" cy="204" r="8" fill="#fffbeb"/>
  <circle cx="390" cy="226" r="8" fill="#fffbeb"/>
  <circle cx="416" cy="244" r="8" fill="#fffbeb"/>
  <circle cx="390" cy="266" r="8" fill="#fffbeb"/>
  <circle cx="416" cy="284" r="8" fill="#fffbeb"/>
  <circle cx="390" cy="306" r="8" fill="#fffbeb"/>
  <circle cx="416" cy="324" r="8" fill="#fffbeb"/>

  <!-- Bottom Label Badge -->
  <rect x="132" y="408" width="248" height="46" rx="23" fill="#101620" stroke="#38bdf8" stroke-width="3"/>
  <text x="256" y="439" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="2">BandoPM</text>
</svg>
