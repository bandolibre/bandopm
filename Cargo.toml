[workspace]
resolver = "2"
members = [
    "crates/synth-core",
    "crates/synth-wasm",
    "crates/synth-eval",
    "crates/synth-standalone",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
rtrb = "0.3"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
